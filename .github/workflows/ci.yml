name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
          POSTGRES_DB: skillbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://skillbridge:skillbridge@localhost:5432/skillbridge
          JWT_SECRET_KEY: ci-test-secret
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Run frontend tests
        run: npm test
      - name: Build
        run: npm run build
